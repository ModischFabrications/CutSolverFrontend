    <!-- Umami Analytics (Tracks cutsolver.modisch.me and third-party hostings; ignores localhost) -->

        const s = document.createElement('script');
        s.defer = true;
        s.src = 'https://analytics.modisch.me/script.js';
        s.setAttribute('data-website-id', '1466a35c-b1d1-4906-801b-676804a500ae');
        document.head.appendChild(s);
      }
    </script>
</head>
